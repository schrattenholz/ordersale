SilverStripe\Security\Group:
  privat:
    Title: Privatkunden
    Code: privatkunden
  wieder:
    Title: Wiederverkäufer
    Code: wiederverkaeufer

Schrattenholz\Order\OrderConfig:
  shop:
    Title: Testhof
    OrderEmail: order@testhof.invalid
    InfoEmail: hallo@testhof.invalid

Schrattenholz\OrderProfileFeature\OrderCustomerGroup:
  privat:
    Title: Privatkunde
    IsDefault: 1
    Group: =>SilverStripe\Security\Group.privat
    OrderConfig: =>Schrattenholz\Order\OrderConfig.shop
  wieder:
    Title: Wiederverkäufer
    IsDefault: 0
    Group: =>SilverStripe\Security\Group.wieder
    OrderConfig: =>Schrattenholz\Order\OrderConfig.shop

SilverStripe\Security\Member:
  stammkunde:
    FirstName: Hans
    Surname: Stamm
    Email: hans.stamm@example.invalid
    Street: Hofweg 2
    ZIP: '55469'
    City: Simmern
    PhoneNumber: '06761 111111'
    Groups: =>SilverStripe\Security\Group.wieder

Schrattenholz\Delivery\DeliveryType:
  abholung:
    Title: Abholung
    Type: collection

Schrattenholz\Delivery\CollectionDay:
  freitag:
    Title: Freitag
    Day: friday
    TimeFrom: '14:00:00'
    TimeTo: '18:00:00'

Schrattenholz\Payment\PaymentMethod_Collection:
  bar:
    Title: Barzahlung bei Abholung

# Wie auf dem Hof: die Produkte liegen in einer Warengruppe (ProductList)
Schrattenholz\Order\ProductList:
  verkauf:
    Title: Verkauf
    URLSegment: verkauf

Schrattenholz\Order\Product:
  kaese:
    Title: Testkäse
    URLSegment: testkaese
    Parent: =>Schrattenholz\Order\ProductList.verkauf

Schrattenholz\Order\Preis:
  stueck:
    # wie die meisten Varianten auf dem Hof: kein Inhaltstext, nur die Menge
    Amount: 250
    Unit: weight
    Price: 5.50
    Product: =>Schrattenholz\Order\Product.kaese
    Inventory: 10
    InfiniteInventory: 0
    InPreSale: 0

# Gruppenpreise legt das Modul beim Schreiben von Produkt und Variante selbst an
# (leer, je Kundengruppe eine Zeile); der Test füllt sie in setUp().
